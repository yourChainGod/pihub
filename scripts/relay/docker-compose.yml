# PiHub relay on tokyo-arm: a single NATS Core container terminating WSS with
# the Cloudflare origin certificate. No JetStream, no data volume.
# Layout on the host: /root/pihub-relay/
#   docker-compose.yml  nats-server.conf  accounts.conf (generated by provision)
#   certs/origin.pem  certs/origin.key    (Cloudflare origin cert — never commit)
#   accounts.json       (provision source of truth, 0600)
# Bring up: docker compose up -d
# Provision accounts: docker run --rm -v "$PWD:/relay" -w /relay node:22-alpine node relay-provision.mjs ...

services:
  nats:
    image: nats:2.11-alpine
    container_name: pihub-relay-nats
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "443:443"
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./accounts.conf:/etc/nats/accounts.conf:ro
      - ./certs:/etc/nats/certs:ro
    restart: unless-stopped

# PiHub relay on tokyo-arm: NATS Core (websocket, no JetStream) behind Caddy,
# which terminates TLS with the Cloudflare origin certificate. Caddy also
# normalizes the WebSocket Upgrade headers Cloudflare mangles (NATS's strict
# handshake rejects the CF-proxied form).
# Layout on the host: /root/pihub-relay/
#   docker-compose.yml  nats-server.conf  Caddyfile  accounts.conf (generated)
#   certs/origin.pem  certs/origin.key    (Cloudflare origin cert — never commit)
#   accounts.json       (provision source of truth, 0600)
# Bring up: docker compose up -d
# Provision accounts: docker run --rm -v "$PWD:/relay" -w /relay node:22-alpine node relay-provision.mjs ...

services:
  nats:
    image: nats:2.11-alpine
    container_name: pihub-relay-nats
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./accounts.conf:/etc/nats/accounts.conf:ro
    restart: unless-stopped
    # No published ports: only reachable through the caddy service.

  caddy:
    image: caddy:2-alpine
    container_name: pihub-relay-caddy
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      - nats

volumes:
  caddy_data:

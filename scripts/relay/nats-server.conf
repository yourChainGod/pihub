# PiHub NATS Core relay — websocket-only ingress, no JetStream. Runs as the
# pihub-relay-nats container and terminates TLS itself with the Cloudflare
# origin certificate (15-year validity; renewal = swap files + restart).
# Accounts live in an include file managed by relay-provision.mjs; reload via
# `docker kill -s HUP pihub-relay-nats`.

host: 127.0.0.1
port: 4222               # loopback only: in-container admin / nats CLI
server_name: pihub-relay
pid_file: /run/nats-relay.pid

max_payload: 8388608     # 8MB — relay protocol frames are ≤ 1MB, headroom for envelopes
max_connections: 1024
max_pending: 67108864    # per-connection slow-consumer buffer; excess drops the consumer
write_deadline: 10s
ping_interval: 30s

websocket {
  host: 0.0.0.0          # published as 443 by compose; Cloudflare is the sole ingress
  port: 443
  compression: true
  handshake_timeout: 5s
  tls {
    cert_file: "/etc/nats/certs/origin.pem"
    key_file: "/etc/nats/certs/origin.key"
  }
}

include accounts.conf

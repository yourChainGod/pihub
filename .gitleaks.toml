title = "PiHub secret and privacy scanning"
minVersion = "8.25.0"

[extend]
useDefault = true

[[rules]]
id = "pihub-tailnet-hostname"
description = "Private Tailscale hostnames must not be committed"
regex = '''(?i)\b(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.){2,}[a-z0-9-]*ts\.net\b'''
keywords = ["ts.net"]

[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''(?i)\b(?:device\.)?example\.ts\.net\b''',
  '''(?i)\bstudio-mac\.tailnet\.ts\.net\b''',
]

[[rules]]
id = "pihub-cgnat-host-address"
description = "Concrete Tailscale CGNAT host addresses must not be committed"
regex = '''\b100\.(?:6[4-9]|[78][0-9]|9[0-9]|1[01][0-9]|12[0-7])(?:\.\d{1,3}){2}\b'''

[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''^100\.64\.0\.[0-2]$''',
  '''^100\.100\.10\.20$''',
  '''^100\.100\.20\.30$''',
  '''^100\.100\.100\.100$''',
]

[[rules]]
id = "pihub-user-home-path"
description = "Build-machine user home paths must not be committed"
regex = '''(?i)(?:/(?:Users|home)/[a-z0-9._& -]+/|[a-z]:[\\/]Users[\\/][^\\/\r\n]+[\\/])'''

[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''(?i)^/(?:Users|home)/(?:a & b|alex|demo|example|me|pi|pi user|private-user|test|user|username)/''',
  '''(?i)^[a-z]:[\\/]Users[\\/](?:alex|demo|example|me|pi|private-user|test|user|username)[\\/]''',
]

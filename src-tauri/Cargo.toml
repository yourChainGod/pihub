[package]
name = "pihub-desktop"
version = "0.0.1"
description = "A private cross-platform desktop hub for Pi agent devices"
authors = ["PiHub Contributors"]
edition = "2021"

[lib]
name = "pihub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "zstd", "stream"] }
reqwest-updater = { package = "reqwest", version = "=0.13.4", default-features = false }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "process", "io-util"] }
url = "2"
percent-encoding = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
bytes = "1"
getrandom = "0.3"
hmac = "0.12"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
minisign-verify = "=0.2.5"
semver = "=1.0.28"
time = { version = "=0.3.55", features = ["parsing"] }
memchr = "2.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

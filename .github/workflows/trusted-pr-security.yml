name: Trusted PR Security

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: trusted-pr-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-privacy-and-secrets:
    name: Trusted privacy and secrets
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted base policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Check out untrusted candidate without credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable checkout identities
        shell: bash
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "${EXPECTED_BASE}"
          test "$(git -C candidate rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      - name: Scan candidate with trusted privacy policy
        run: >-
          node trusted/scripts/privacy-scan.mjs
          --root "${GITHUB_WORKSPACE}/candidate"
          --fail-on-warnings

      - name: Install the pinned Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          readonly version="8.30.1"
          readonly expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          readonly archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
          chmod 0755 "${RUNNER_TEMP}/gitleaks"

      - name: Scan candidate with trusted Gitleaks policy
        run: >-
          "${RUNNER_TEMP}/gitleaks" dir "${GITHUB_WORKSPACE}/candidate"
          --redact=100
          --config "${GITHUB_WORKSPACE}/trusted/.gitleaks.toml"
          --no-banner

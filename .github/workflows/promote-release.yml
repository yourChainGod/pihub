name: Promote PiHub Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing immutable refs/tags/vMAJOR.MINOR.PATCH release ref
        required: true
        type: string
      release_checksum_sha256:
        description: SHA-256 of the draft RELEASE-SHA256SUMS reviewed by the approver
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pihub-release-promotion-${{ inputs.release_ref }}
  cancel-in-progress: false

env:
  CI: true
  FORCE_COLOR: "0"
  npm_config_ignore_scripts: "true"
  npm_config_registry: https://registry.npmjs.org

jobs:
  promote:
    name: Promote signed candidate to stable/latest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pihub-release-promotion
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      PIHUB_RELEASE_REF: ${{ inputs.release_ref }}
      PIHUB_RELEASE_CHECKSUM_SHA256: ${{ inputs.release_checksum_sha256 }}
    steps:
      - name: Check out the immutable release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install locked verification dependencies
        run: |
          node scripts/verify-server-lock.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix server --ignore-scripts --no-audit --no-fund

      - name: Verify, promote, and anonymously re-fetch the exact candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "yourChainGod/pihub" || "${GITHUB_REPOSITORY_VISIBILITY}" != "public" ]]; then
            echo "Stable promotion requires the public yourChainGod/pihub repository" >&2
            exit 1
          fi
          if [[ ! "${PIHUB_RELEASE_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ || "${GITHUB_REF}" != "${PIHUB_RELEASE_REF}" ]]; then
            echo "Promotion must run from the exact release tag workflow definition" >&2
            exit 1
          fi
          if [[ ! "${PIHUB_RELEASE_CHECKSUM_SHA256}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "release_checksum_sha256 must be a lowercase SHA-256 digest" >&2
            exit 1
          fi

          readonly tag="${PIHUB_RELEASE_REF#refs/tags/}"
          readonly tag_object="$(git rev-parse --verify "${PIHUB_RELEASE_REF}")"
          readonly commit="$(git rev-parse --verify "${PIHUB_RELEASE_REF}^{commit}")"
          readonly candidate_directory="$(mktemp -d)"
          readonly checksum_before="${RUNNER_TEMP}/RELEASE-SHA256SUMS.before"
          readonly latest_response="${RUNNER_TEMP}/latest-release.json"

          assert_remote_source() {
            local remote_ref remote_object remote_type remote_tag comparison peel_depth
            remote_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
            remote_object="$(jq -er '.object.sha' <<<"${remote_ref}")"
            remote_type="$(jq -er '.object.type' <<<"${remote_ref}")"
            [[ "${remote_object}" == "${tag_object}" ]] || return 1
            peel_depth=0
            while [[ "${remote_type}" == "tag" ]]; do
              ((peel_depth += 1))
              ((peel_depth <= 4)) || return 1
              remote_tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${remote_object}")"
              remote_object="$(jq -er '.object.sha' <<<"${remote_tag}")"
              remote_type="$(jq -er '.object.type' <<<"${remote_tag}")"
            done
            [[ "${remote_type}" == "commit" && "${remote_object}" == "${commit}" ]] || return 1
            comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${commit}...main" --jq '.status')"
            [[ "${comparison}" == "ahead" || "${comparison}" == "identical" ]]
          }

          assert_remote_source
          for required_workflow in ci.yml security.yml; do
            runs="$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${required_workflow}/runs?head_sha=${commit}&per_page=100" \
              | jq -c '[.[].workflow_runs[] | select(.head_sha == $commit and (.event == "push" or .event == "merge_group"))]' \
                --arg commit "${commit}")"
            jq -e 'length > 0 and (sort_by(.run_number, .run_attempt) | last | .status == "completed" and .conclusion == "success")' \
              <<<"${runs}" >/dev/null
          done

          releases="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -c --arg tag "${tag}" '[.[][] | select(.tag_name == $tag)]')"
          [[ "$(jq -r 'length' <<<"${releases}")" == "1" ]] || { echo "Expected one release for ${tag}" >&2; exit 1; }
          release="$(jq -c '.[0]' <<<"${releases}")"
          jq -e --arg tag "${tag}" --arg commit "${commit}" \
            '.tag_name == $tag and .target_commitish == $commit and .prerelease == false' \
            <<<"${release}" >/dev/null
          readonly release_id="$(jq -er '.id' <<<"${release}")"
          readonly release_is_draft="$(jq -r '.draft' <<<"${release}")"

          if ! latest_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "${latest_response}" --write-out '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest")"; then
            echo "Could not determine the current stable release" >&2
            exit 1
          fi
          case "${latest_status}" in
            200)
              current_latest_id="$(jq -er '.id' "${latest_response}")"
              current_tag="$(jq -er '.tag_name' "${latest_response}")"
              [[ "${current_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Current latest release has a noncanonical tag" >&2; exit 1; }
              if [[ "${current_latest_id}" == "${release_id}" ]]; then
                [[ "${release_is_draft}" == "false" ]] || { echo "GitHub returned a draft as latest" >&2; exit 1; }
                promotion_mode="verify-only"
              else
                [[ "${release_is_draft}" == "true" ]] || { echo "Only a draft can replace the current latest release" >&2; exit 1; }
                promotion_mode="promote"
                node - "${tag#v}" "${current_tag#v}" <<'NODE'
          const [candidate, current] = process.argv.slice(2).map((value) => value.split(".").map(BigInt));
          const greater = candidate.some((value, index) => value > current[index]
            && candidate.slice(0, index).every((part, partIndex) => part === current[partIndex]));
          if (!greater) {
            console.error("The candidate version must be strictly newer than the current stable release");
            process.exit(1);
          }
          NODE
              fi
              ;;
            404)
              [[ "${release_is_draft}" == "true" ]] || { echo "A published release exists without a stable latest identity" >&2; exit 1; }
              promotion_mode="promote"
              ;;
            *)
              echo "GitHub latest release lookup failed with HTTP ${latest_status}" >&2
              exit 1
              ;;
          esac

          assets="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" | jq -c '[.[][]]')"
          jq -e 'length > 0 and (group_by(.name) | all(length == 1)) and all(.digest | test("^sha256:[a-f0-9]{64}$"))' <<<"${assets}" >/dev/null
          while IFS=$'\t' read -r asset_id asset_name; do
            [[ "${asset_name}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "Unsafe release asset name" >&2; exit 1; }
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "${candidate_directory}/${asset_name}"
          done < <(jq -r '.[] | [.id, .name] | @tsv' <<<"${assets}")

          release_snapshot="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            | jq -c '{id, tag_name, target_commitish, draft, prerelease, created_at, updated_at}')"
          asset_snapshot="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            | jq -c '[.[][] | {id, name, size, updated_at, digest}] | sort_by(.name)')"
          jq -e 'all(.[]; .digest | test("^sha256:[a-f0-9]{64}$"))' <<<"${asset_snapshot}" >/dev/null
          while IFS=$'\t' read -r asset_name asset_size asset_digest; do
            test "$(stat --format='%s' "${candidate_directory}/${asset_name}")" = "${asset_size}"
            test "sha256:$(sha256sum "${candidate_directory}/${asset_name}" | cut -d ' ' -f 1)" = "${asset_digest}"
          done < <(jq -r '.[] | [.name, .size, .digest] | @tsv' <<<"${asset_snapshot}")

          test "$(sha256sum "${candidate_directory}/RELEASE-SHA256SUMS" | cut -d ' ' -f 1)" = "${PIHUB_RELEASE_CHECKSUM_SHA256}"
          cp "${candidate_directory}/RELEASE-SHA256SUMS" "${checksum_before}"
          node scripts/finalize-desktop-release.mjs --release "${candidate_directory}"
          cmp "${checksum_before}" "${candidate_directory}/RELEASE-SHA256SUMS"
          node scripts/verify-release-candidate.mjs \
            --directory "${candidate_directory}" \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${tag}"
          while IFS= read -r asset; do
            gh attestation verify "${candidate_directory}/${asset}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          done < <(find "${candidate_directory}" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)

          assert_remote_source
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" | jq -c '{id, tag_name, target_commitish, draft, prerelease, created_at, updated_at}')" = "${release_snapshot}"
          test "$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" | jq -c '[.[][] | {id, name, size, updated_at, digest}] | sort_by(.name)')" = "${asset_snapshot}"
          if [[ "${promotion_mode}" == "promote" ]]; then
            promoted="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false -F prerelease=false -f make_latest=true)"
            jq -e --argjson id "${release_id}" --arg tag "${tag}" --arg commit "${commit}" \
              '.id == $id and .tag_name == $tag and .target_commitish == $commit and .draft == false and .prerelease == false' \
              <<<"${promoted}" >/dev/null
          fi
          latest_ready=false
          for attempt in {1..12}; do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > "${latest_response}" \
              && [[ "$(jq -er '.id' "${latest_response}")" == "${release_id}" ]]; then
              latest_ready=true
              break
            fi
            sleep 5
          done
          [[ "${latest_ready}" == "true" ]] || { echo "GitHub latest release API did not converge" >&2; exit 1; }
          jq -e --argjson id "${release_id}" --arg tag "${tag}" --arg commit "${commit}" \
            '.id == $id and .tag_name == $tag and .target_commitish == $commit and .draft == false and .prerelease == false' \
            "${latest_response}" >/dev/null
          latest_release_id="$(jq -er '.id' "${latest_response}")"
          test "${latest_release_id}" = "${release_id}"
          test "$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" | jq -c '[.[][] | {id, name, size, updated_at, digest}] | sort_by(.name)')" = "${asset_snapshot}"

          for endpoint_asset in pihub-desktop-v1.json pihub-desktop-v1.json.sig release-manifest.json; do
            verified=false
            for attempt in {1..12}; do
              if curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
                --header 'Cache-Control: no-cache' \
                "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${endpoint_asset}?promotion=${release_id}-${attempt}" \
                --output "${RUNNER_TEMP}/${endpoint_asset}" \
                && cmp "${candidate_directory}/${endpoint_asset}" "${RUNNER_TEMP}/${endpoint_asset}"; then
                verified=true
                break
              fi
              sleep 5
            done
            [[ "${verified}" == "true" ]] || { echo "Stable endpoint did not converge: ${endpoint_asset}" >&2; exit 1; }
          done
          assert_remote_source

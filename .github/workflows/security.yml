name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 19 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "0"

jobs:
  privacy-and-secrets:
    name: Privacy and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the complete history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.19.0"

      - name: Run the repository privacy gate
        run: node scripts/privacy-scan.mjs --fail-on-warnings

      - name: Verify the Server and extension dependency locks
        run: |
          node scripts/verify-server-lock.mjs
          node scripts/default-extension-bundle.mjs

      - name: Install locked release-test dependencies
        env:
          npm_config_ignore_scripts: "true"
          npm_config_registry: https://registry.npmjs.org
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix server --ignore-scripts --no-audit --no-fund

      - name: Test the privacy gate
        run: >-
          node --test
          scripts/default-extension-bundle.test.mjs
          scripts/privacy-scan.test.mjs
          scripts/release-assembly.test.mjs
          scripts/release-workflow-security.test.mjs
          scripts/server-release-sbom.test.mjs
          scripts/smoke-server-resource.test.mjs
          scripts/verify-server-lock.test.mjs
          scripts/verify-server-release.test.mjs

      - name: Install the pinned Actionlint binary
        shell: bash
        run: |
          set -euo pipefail
          readonly version="1.7.12"
          readonly expected="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          readonly archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" actionlint
          chmod 0755 "${RUNNER_TEMP}/actionlint"

      - name: Lint GitHub Actions workflows
        run: |
          "${RUNNER_TEMP}/actionlint" -color=false .github/workflows/*.yml

      - name: Install the pinned Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          readonly version="8.30.1"
          readonly expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          readonly archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
          chmod 0755 "${RUNNER_TEMP}/gitleaks"

      - name: Scan the full Git history with Gitleaks
        run: >-
          "${RUNNER_TEMP}/gitleaks" git
          --redact=100
          --config .gitleaks.toml
          --log-opts=--all
          --no-banner

      - name: Scan the tracked tree with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          readonly snapshot="${RUNNER_TEMP}/gitleaks-tree"
          install -d -m 0700 "${snapshot}"
          git archive --format=tar HEAD | tar --extract --file=- --directory="${snapshot}" --no-same-owner
          "${RUNNER_TEMP}/gitleaks" dir "${snapshot}" \
            --redact=100 \
            --config .gitleaks.toml \
            --no-banner

  dependency-review:
    name: Dependency review
    if: >-
      github.event_name == 'pull_request'
      && (github.event.repository.visibility == 'public' || vars.GHAS_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
          comment-summary-in-pr: never
          warn-only: false

  dependency-audit:
    name: Dependency audit (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            directory: .
          - project: server
            directory: server
          - project: extensions
            directory: extensions
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Audit the lock file without installing dependencies
        working-directory: ${{ matrix.directory }}
        env:
          npm_config_ignore_scripts: "true"
          npm_config_registry: https://registry.npmjs.org
        run: npm audit --package-lock-only --omit=peer --audit-level=high

  rust-audit:
    name: Rust dependency audit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Audit Cargo.lock with the RustSec advisory database
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          working-directory: src-tauri

  rust-audit-scheduled:
    name: Rust dependency audit (scheduled)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Audit Cargo.lock with the RustSec advisory database
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          working-directory: src-tauri

  server-bin-tests:
    name: Server installer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.19.0"
      - name: Install locked Server dependencies
        env:
          npm_config_ignore_scripts: "true"
          npm_config_registry: https://registry.npmjs.org
        run: npm ci --prefix server --ignore-scripts --no-audit --no-fund
      - name: Run tests omitted by the package test glob
        working-directory: server
        run: node --test "bin/**/*.test.mjs"

  sbom:
    name: Validate SBOM (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            directory: .
          - project: server
            directory: server
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Generate a CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ matrix.directory }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/${{ matrix.project }}.cdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Install the pinned CycloneDX validator
        shell: bash
        run: |
          set -euo pipefail
          readonly expected="bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746"
          readonly validator="${RUNNER_TEMP}/cyclonedx"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${validator}" \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64"
          echo "${expected}  ${validator}" | sha256sum --check --strict
          chmod 0755 "${validator}"
      - name: Validate the generated SBOM
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/cyclonedx" validate \
            --input-file "${RUNNER_TEMP}/${{ matrix.project }}.cdx.json"

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.event.repository.visibility == 'public' || vars.GHAS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - rust
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

  required:
    name: Security required
    if: ${{ always() }}
    needs:
      - privacy-and-secrets
      - dependency-review
      - dependency-audit
      - rust-audit
      - rust-audit-scheduled
      - server-bin-tests
      - sbom
      - codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable security gate
        shell: bash
        env:
          PRIVACY_RESULT: ${{ needs.privacy-and-secrets.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          RUST_AUDIT_RESULT: ${{ needs.rust-audit.result }}
          RUST_AUDIT_SCHEDULED_RESULT: ${{ needs.rust-audit-scheduled.result }}
          SERVER_BIN_TESTS_RESULT: ${{ needs.server-bin-tests.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail
          test "${PRIVACY_RESULT}" = "success"
          test "${DEPENDENCY_AUDIT_RESULT}" = "success"
          test "${SERVER_BIN_TESTS_RESULT}" = "success"
          test "${SBOM_RESULT}" = "success"
          test "${DEPENDENCY_REVIEW_RESULT}" = "success" \
            || test "${DEPENDENCY_REVIEW_RESULT}" = "skipped"
          test "${CODEQL_RESULT}" = "success" \
            || test "${CODEQL_RESULT}" = "skipped"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            test "${RUST_AUDIT_RESULT}" = "skipped"
            test "${RUST_AUDIT_SCHEDULED_RESULT}" = "success"
          else
            test "${RUST_AUDIT_RESULT}" = "success"
            test "${RUST_AUDIT_SCHEDULED_RESULT}" = "skipped"
          fi

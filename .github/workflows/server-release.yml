name: Server Release

# 服务端专用发布流水线（仓库已公开，标准 runner 免费；桌面端发布链已移除，
# 只保留服务端：validate → 6 平台构建 → 签名 → draft）。
# 注意：npm/rust audit 门禁不在这里——固定上游依赖的不可修复 CVE 会阻塞发布；
# 审计走手动触发的 security.yml。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing immutable refs/tags/vMAJOR.MINOR.PATCH ref to release
        required: true
        type: string

permissions:
  contents: read

env:
  CI: true
  FORCE_COLOR: "0"
  npm_config_ignore_scripts: "true"
  npm_config_registry: https://registry.npmjs.org

concurrency:
  group: pihub-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIHUB_RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      tag: ${{ steps.source.outputs.tag }}
      tag_object: ${{ steps.source.outputs.tag_object }}
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      pub_date: ${{ steps.source.outputs.pub_date }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.PIHUB_RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, repository, and main ancestry
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readonly release_ref="${PIHUB_RELEASE_REF}"
          if [[ "${GITHUB_REPOSITORY}" != "yourChainGod/pihub" ]]; then
            echo "Release repository must be exactly yourChainGod/pihub" >&2
            exit 1
          fi
          if [[ "${GITHUB_REPOSITORY_VISIBILITY}" != "public" ]]; then
            echo "Anonymous update assets require the release repository to be public" >&2
            exit 1
          fi
          if [[ ! "${release_ref}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release ref must be exactly refs/tags/vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "${release_ref}" ]]; then
            echo "The workflow definition and release source must come from the same tag ref" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "${release_ref}"; then
            echo "The requested ref is not an exact local tag ref" >&2
            exit 1
          fi
          readonly tag="${release_ref#refs/tags/}"
          readonly tag_object="$(git rev-parse --verify "${release_ref}")"
          readonly commit="$(git rev-parse --verify "${release_ref}^{commit}")"
          if [[ ! "${tag_object}" =~ ^[0-9a-f]{40}$ || ! "${commit}" =~ ^[0-9a-f]{40}$ || "$(git rev-parse HEAD)" != "${commit}" ]]; then
            echo "Checked out source does not resolve to the requested tag commit" >&2
            exit 1
          fi

          remote_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
          remote_object="$(jq -er '.object.sha' <<<"${remote_ref}")"
          remote_type="$(jq -er '.object.type' <<<"${remote_ref}")"
          if [[ "${remote_object}" != "${tag_object}" ]]; then
            echo "The remote tag object differs from the checked out tag" >&2
            exit 1
          fi
          peel_depth=0
          while [[ "${remote_type}" == "tag" ]]; do
            ((peel_depth += 1))
            if ((peel_depth > 4)); then
              echo "The release tag contains too many nested tag objects" >&2
              exit 1
            fi
            remote_tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${remote_object}")"
            remote_object="$(jq -er '.object.sha' <<<"${remote_tag}")"
            remote_type="$(jq -er '.object.type' <<<"${remote_tag}")"
          done
          if [[ "${remote_type}" != "commit" || "${remote_object}" != "${commit}" ]]; then
            echo "The remote tag does not peel to the validated commit" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "Complete checkout is missing refs/remotes/origin/main" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${commit}" refs/remotes/origin/main; then
            echo "Release tag ${tag} is not reachable from origin/main" >&2
            exit 1
          fi
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${commit}...main" --jq '.status')"
          if [[ "${comparison}" != "ahead" && "${comparison}" != "identical" ]]; then
            echo "Release tag ${tag} is not reachable from the current remote main" >&2
            exit 1
          fi
          readonly version="${tag#v}"
          readonly pub_date="$(git show -s --format=%cI "${commit}")"
          {
            echo "ref=${release_ref}"
            echo "tag=${tag}"
            echo "tag_object=${tag_object}"
            echo "commit=${commit}"
            echo "version=${version}"
            echo "pub_date=${pub_date}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            extensions/package-lock.json

      - name: Verify the locked Server and extension supply chains
        run: |
          node scripts/verify-server-lock.mjs
          node scripts/default-extension-bundle.mjs

      - name: Validate release configuration
        env:
          PIHUB_RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: node scripts/check-release-config.mjs --tag "${PIHUB_RELEASE_TAG}"

  build-server-release:
    name: Server ${{ matrix.platform }}/${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PIHUB_RELEASE_REF: ${{ needs.validate.outputs.ref }}
      PIHUB_RELEASE_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
      PIHUB_RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
          - runner: windows-2025
            platform: win32
            arch: x64
    steps:
      - name: Check out validated source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate immutable release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readonly tag="${PIHUB_RELEASE_REF#refs/tags/}"
          if [[ ! "${PIHUB_RELEASE_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ || "$(git rev-parse HEAD)" != "${PIHUB_RELEASE_COMMIT}" ]]; then
            echo "The checked out release commit is invalid" >&2
            exit 1
          fi
          remote_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
          remote_object="$(jq -er '.object.sha' <<<"${remote_ref}")"
          remote_type="$(jq -er '.object.type' <<<"${remote_ref}")"
          if [[ "${remote_object}" != "${PIHUB_RELEASE_TAG_OBJECT}" ]]; then
            echo "The release tag object moved after validation" >&2
            exit 1
          fi
          peel_depth=0
          while [[ "${remote_type}" == "tag" ]]; do
            ((peel_depth += 1))
            ((peel_depth <= 4)) || { echo "The release tag nesting is invalid" >&2; exit 1; }
            remote_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${remote_object}")"
            remote_object="$(jq -er '.object.sha' <<<"${remote_tag}")"
            remote_type="$(jq -er '.object.type' <<<"${remote_tag}")"
          done
          if [[ "${remote_type}" != "commit" || "${remote_object}" != "${PIHUB_RELEASE_COMMIT}" ]]; then
            echo "The release tag commit moved after validation" >&2
            exit 1
          fi
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PIHUB_RELEASE_COMMIT}...main" --jq '.status')"
          if [[ "${comparison}" != "ahead" && "${comparison}" != "identical" ]]; then
            echo "The validated release commit is no longer reachable from main" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            extensions/package-lock.json

      - name: Verify the locked Server and extension supply chains
        run: |
          node scripts/verify-server-lock.mjs
          node scripts/default-extension-bundle.mjs

      - name: Install locked Server dependencies
        run: npm ci --prefix server --ignore-scripts --no-audit --no-fund

      - name: Build the standalone Server release
        run: |
          npm run server:build
          node scripts/build-server-release.mjs --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"

      - name: Verify Server release inventory and privacy
        run: node scripts/verify-server-release.mjs --directory release-artifacts

      - name: Smoke the relocated standalone Server
        run: >-
          node scripts/smoke-server-resource.mjs
          --archive "release-artifacts/pihub-server-${{ needs.validate.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"

      - name: Upload Server release components
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sign-release:
    name: Sign the Server release manifest
    needs:
      - validate
      - build-server-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pihub-release-signing
    env:
      PIHUB_RELEASE_REF: ${{ needs.validate.outputs.ref }}
      PIHUB_RELEASE_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
      PIHUB_RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install manifest tooling
        run: |
          node scripts/verify-server-lock.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix server --ignore-scripts --no-audit --no-fund

      - name: Download all Server release components
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: server-release-*
          path: server-artifacts
          merge-multiple: true

      - name: Revalidate immutable release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readonly tag="${PIHUB_RELEASE_REF#refs/tags/}"
          if [[ ! "${PIHUB_RELEASE_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ || "$(git rev-parse HEAD)" != "${PIHUB_RELEASE_COMMIT}" ]]; then
            echo "The checked out release commit is invalid" >&2
            exit 1
          fi
          remote_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
          remote_object="$(jq -er '.object.sha' <<<"${remote_ref}")"
          remote_type="$(jq -er '.object.type' <<<"${remote_ref}")"
          if [[ "${remote_object}" != "${PIHUB_RELEASE_TAG_OBJECT}" ]]; then
            echo "The release tag object moved after validation" >&2
            exit 1
          fi
          peel_depth=0
          while [[ "${remote_type}" == "tag" ]]; do
            ((peel_depth += 1))
            ((peel_depth <= 4)) || { echo "The release tag nesting is invalid" >&2; exit 1; }
            remote_tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${remote_object}")"
            remote_object="$(jq -er '.object.sha' <<<"${remote_tag}")"
            remote_type="$(jq -er '.object.type' <<<"${remote_tag}")"
          done
          if [[ "${remote_type}" != "commit" || "${remote_object}" != "${PIHUB_RELEASE_COMMIT}" ]]; then
            echo "The release tag commit moved after validation" >&2
            exit 1
          fi
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PIHUB_RELEASE_COMMIT}...main" --jq '.status')"
          if [[ "${comparison}" != "ahead" && "${comparison}" != "identical" ]]; then
            echo "The validated release commit is no longer reachable from main" >&2
            exit 1
          fi

      - name: Sign Server manifest
        env:
          PIHUB_SERVER_RELEASE_PRIVATE_KEY: ${{ secrets.PIHUB_SERVER_RELEASE_PRIVATE_KEY }}
          PIHUB_SERVER_RELEASE_PRIVATE_KEY_PASSWORD: ${{ secrets.PIHUB_SERVER_RELEASE_PRIVATE_KEY_PASSWORD }}
        run: node scripts/sign-server-release.mjs server-artifacts

      - name: Scan the signed release candidate
        run: node scripts/privacy-scan.mjs server-artifacts

      - name: Upload the signed release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-signed-${{ needs.validate.outputs.commit }}
          path: server-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-draft:
    name: Upload the immutable Server release draft
    needs:
      - validate
      - sign-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: pihub-release-publishing
    permissions:
      contents: write
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      PIHUB_RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      PIHUB_RELEASE_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
      PIHUB_RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - name: Download the signed release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: server-signed-${{ needs.validate.outputs.commit }}
          path: server-artifacts

      - name: Create or validate the immutable draft and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readonly tag="${PIHUB_RELEASE_TAG}"
          readonly commit="${PIHUB_RELEASE_COMMIT}"
          readonly expected_list="${RUNNER_TEMP}/expected-assets.txt"
          readonly current_list="${RUNNER_TEMP}/current-assets.txt"
          readonly missing_list="${RUNNER_TEMP}/missing-assets.txt"

          remote_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
          remote_object="$(jq -er '.object.sha' <<<"${remote_ref}")"
          remote_type="$(jq -er '.object.type' <<<"${remote_ref}")"
          [[ "${remote_object}" == "${PIHUB_RELEASE_TAG_OBJECT}" ]] || { echo "The release tag moved during publication" >&2; exit 1; }
          peel_depth=0
          while [[ "${remote_type}" == "tag" ]]; do
            ((peel_depth += 1))
            ((peel_depth <= 4)) || exit 1
            remote_tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${remote_object}")"
            remote_object="$(jq -er '.object.sha' <<<"${remote_tag}")"
            remote_type="$(jq -er '.object.type' <<<"${remote_tag}")"
          done
          [[ "${remote_type}" == "commit" && "${remote_object}" == "${commit}" ]] || { echo "The release commit moved during publication" >&2; exit 1; }
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${commit}...main" --jq '.status')"
          [[ "${comparison}" == "ahead" || "${comparison}" == "identical" ]] || { echo "The release commit is no longer reachable from main" >&2; exit 1; }

          find server-artifacts -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > "${expected_list}"
          if [[ ! -s "${expected_list}" ]]; then
            echo "No release assets were assembled" >&2
            exit 1
          fi

          releases_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          matching_releases="$(jq -c --arg tag "${tag}" '[.[][] | select(.tag_name == $tag)]' <<<"${releases_json}")"
          release_count="$(jq -r 'length' <<<"${matching_releases}")"
          if [[ "${release_count}" == "1" ]]; then
            release_json="$(jq -c '.[0]' <<<"${matching_releases}")"
            jq -e --arg tag "${tag}" --arg commit "${commit}" \
              '.tag_name == $tag and .target_commitish == $commit and .draft == true and .prerelease == false' \
              <<<"${release_json}" >/dev/null
            release_id="$(jq -er '.id' <<<"${release_json}")"
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              | jq -r '.[].name' | LC_ALL=C sort > "${current_list}"
            if [[ -s "${current_list}" ]] && comm -23 "${current_list}" "${expected_list}" | grep -q .; then
              echo "Existing draft contains an unexpected asset; refusing to modify it" >&2
              exit 1
            fi
          elif [[ "${release_count}" == "0" ]]; then
            release_json="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${tag}" \
              -f target_commitish="${commit}" \
              -f name="PiHub Server ${tag}" \
              -f body='Signed PiHub Server artifacts. Keep as draft until native install, update, and rollback verification pass.'" \
              -f draft=true \
              -f prerelease=false)"
            release_id="$(jq -er '.id' <<<"${release_json}")"
            : > "${current_list}"
          else
            echo "Multiple releases use the requested tag; refusing publication" >&2
            exit 1
          fi

          comm -23 "${expected_list}" "${current_list}" > "${missing_list}"
          while IFS= read -r asset; do
            [[ -n "${asset}" ]] || continue
            encoded_asset="$(jq -rn --arg value "${asset}" '$value | @uri')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@server-artifacts/${asset}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${encoded_asset}" >/dev/null
          done < "${missing_list}"

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            | jq -r '.[].name' | LC_ALL=C sort > "${current_list}"
          diff -u "${expected_list}" "${current_list}"

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: pihub-ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_COLOR: "0"
  npm_config_ignore_scripts: "true"
  npm_config_registry: https://registry.npmjs.org

jobs:
  product-quality:
    name: Product quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            extensions/package-lock.json

      - name: Read the validated Server version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          readonly version="$(node -p 'require("./server/package.json").version')"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          echo "server=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
          components: clippy,rustfmt

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Verify the locked Server and extension supply chains
        run: |
          node scripts/verify-server-lock.mjs
          node scripts/default-extension-bundle.mjs

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix server --ignore-scripts --no-audit --no-fund

      - name: Install locked Playwright browsers
        run: npx --no-install playwright install --with-deps chromium firefox webkit

      - name: Validate scripts and private-data policy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/privacy-scan.mjs --fail-on-warnings
          node scripts/verify-icon-assets.mjs
          node --test scripts/*.test.mjs
          npm run test:unit
          find scripts -maxdepth 1 -type f -name '*.mjs' -print0 | LC_ALL=C sort -z | xargs -0 -n 1 node --check

      - name: Validate desktop web application
        run: |
          npm run lint
          npm run build
          npm run test:e2e

      - name: Upload browser diagnostics after failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

      - name: Validate Server
        run: |
          npm --prefix server test
          npm --prefix server run lint
          npm --prefix server exec -- tsc --noEmit --pretty false
          npm run server:build
          node scripts/check-release-config.mjs

      - name: Validate Rust desktop shell
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features

  native-platforms:
    name: Native ${{ matrix.platform }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
          - runner: windows-2025
            platform: win32
            arch: x64
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            extensions/package-lock.json

      - name: Read the validated Server version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          readonly version="$(node -p 'require("./server/package.json").version')"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          echo "server=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Verify the locked Server and extension supply chains
        run: |
          node scripts/verify-server-lock.mjs
          node scripts/default-extension-bundle.mjs

      - name: Install locked Server dependencies
        run: npm ci --prefix server --ignore-scripts --no-audit --no-fund

      - name: Prepare Linux user service manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          readonly uid="$(id -u)"
          sudo loginctl enable-linger "${USER}"
          sudo systemctl start "user@${uid}.service"
          test -S "/run/user/${uid}/bus"
          {
            echo "XDG_RUNTIME_DIR=/run/user/${uid}"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus"
          } >> "${GITHUB_ENV}"

      - name: Validate native Server service integration
        run: |
          node --test server/bin/pihub-server-install.test.mjs server/bin/pihub-service-platform-smoke.test.mjs server/bin/bounded-log.test.mjs server/bin/server-runtime-environment.test.mjs
          node server/bin/pihub-service-platform-smoke.js

      - name: Build and smoke the native standalone Server
        run: |
          npm run server:build
          node scripts/build-server-release.mjs --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
          node scripts/verify-server-release.mjs --directory release-artifacts
          node scripts/smoke-server-resource.mjs --archive "release-artifacts/pihub-server-${{ steps.version.outputs.server }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"

      - name: Validate native Rust desktop shell
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --all-features

  required:
    name: CI required
    if: ${{ always() }}
    needs:
      - product-quality
      - native-platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI gate
        shell: bash
        env:
          PRODUCT_QUALITY_RESULT: ${{ needs.product-quality.result }}
          NATIVE_PLATFORMS_RESULT: ${{ needs.native-platforms.result }}
        run: |
          set -euo pipefail
          test "${PRODUCT_QUALITY_RESULT}" = "success"
          test "${NATIVE_PLATFORMS_RESULT}" = "success"
